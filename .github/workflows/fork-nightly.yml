# Fork-specific nightly release: Android APK + desktop builds on standard
# GitHub-hosted runners. Upstream's release.yml cannot run here (org-specific
# blacksmith runners, Cloudflare/Azure/Apple secrets), so this workflow covers
# the fork's needs: unsigned desktop artifacts whose embedded update feed
# points at this fork (via GITHUB_REPOSITORY). Linux ships an AppImage and a
# .deb; electron-updater picks the matching file from nightly-linux.yml.
# An arm64 production APK is signed with the ANDROID_DEBUG_KEYSTORE_B64
# secret so it updates in place over existing sideloaded installs.
name: Fork Nightly

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_changes:
    name: Check for changes since last nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: check
        name: Compare HEAD to last nightly tag
        run: |
          last_nightly_tag=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)
          if [[ -z "$last_nightly_tag" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(git rev-parse "$last_nightly_tag^{commit}")" == "$(git rev-parse HEAD)" ]]; then
            echo "No changes since $last_nightly_tag. Skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Resolve nightly version
    needs: [check_changes]
    if: |
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check_changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - id: release_meta
        name: Resolve nightly release version
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u -d "${{ github.run_started_at }}" +%Y%m%d)" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --github-output

  # Windows embeds the Linux CLI archive as the WSL runtime (same as
  # upstream release-desktop.yml). Built on ubuntu-latest, not a node-pty
  # prebuild — `--wsl-prebuild` is gone from build-desktop-artifact.
  build_linux_cli:
    name: Build Linux CLI archive (x64)
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Load T3 Connect public config
        shell: bash
        run: grep -E '^T3CODE_' .env.example >> "$GITHUB_ENV"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Install native build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build web client
        run: vp run --filter @t3tools/web build

      - name: Bundle server with web client
        run: node apps/server/scripts/cli.ts build --verbose

      - name: Build resource monitor
        run: |
          cargo build --locked --release \
            --manifest-path native/resource-monitor/Cargo.toml \
            --target x86_64-unknown-linux-gnu

      - name: Build CLI single-executable
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor \
            "$target_dir/t3-resource-monitor"

      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ needs.preflight.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error

  build_desktop:
    name: Build ${{ matrix.label }}
    needs: [preflight, build_linux_cli]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_linux_cli.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - label: macOS arm64
            runner: macos-latest
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # T3 Connect public identifiers (not secrets; see .env.example comments).
      - name: Load T3 Connect public config
        shell: bash
        run: grep -E '^T3CODE_' .env.example >> "$GITHUB_ENV"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download Linux CLI archive for WSL
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi

      - name: Install browser secret helper build libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build desktop artifact
        shell: bash
        run: |
          set +e
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz)
          fi
          attempts=1
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            attempts=3
          fi
          for attempt in $(seq 1 "$attempts"); do
            vp run dist:desktop:artifact "${args[@]}"
            status=$?
            if [[ $status -eq 0 ]]; then
              exit 0
            fi
            if [[ $attempt -eq $attempts ]]; then
              exit $status
            fi
            echo "Linux AppImage build failed (attempt ${attempt}/${attempts}); retrying in 30s..."
            sleep 30
          done

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.deb" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              if [[ "$(basename "$file")" == builder-debug* ]]; then
                continue
              fi
              cp "$file" release-publish/
            done
          done
          # The Linux job builds the .deb beside the AppImage. nightly-linux.yml
          # lists both, and a .deb install updates itself only when that file
          # is on the same GitHub release.
          if [[ "${{ matrix.platform }}" == "linux" ]] && ! compgen -G "release-publish/*.deb" >/dev/null; then
            echo "Linux build did not produce a .deb." >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  build_android:
    name: Build Android APK (arm64)
    needs: [preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Load T3 Connect public config
        shell: bash
        run: grep -E '^T3CODE_' .env.example >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Generate Android project
        working-directory: apps/mobile
        run: APP_VARIANT=production EXPO_NO_GIT_STATUS=1 npx expo prebuild --clean --platform android

      # AGP's prefab import does not emit fbjniConfig.cmake for this app,
      # so the React Native CMake find_package(fbjni) fails. Stage the
      # published AAR ourselves and point CMake at it.
      - name: Stage fbjni for CMake
        shell: bash
        run: |
          python3 - << 'PY'
          import urllib.request
          import zipfile
          from pathlib import Path

          root = Path("apps/mobile/android/fbjni-prefab")
          aar = Path("/tmp/fbjni.aar")
          urllib.request.urlretrieve(
              "https://repo1.maven.org/maven2/com/facebook/fbjni/fbjni/0.7.0/fbjni-0.7.0.aar",
              aar,
          )
          with zipfile.ZipFile(aar) as archive:
              for name in archive.namelist():
                  if name.startswith("prefab/modules/fbjni/include/") and not name.endswith("/"):
                      dest = root / "include" / name.removeprefix("prefab/modules/fbjni/include/")
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(archive.read(name))
                  elif name.startswith("jni/") and name.endswith(".so"):
                      abi = name.split("/")[1]
                      dest = root / "lib" / abi / "libfbjni.so"
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(archive.read(name))
          (root / "fbjniConfig.cmake").write_text(
              """
              if(NOT TARGET fbjni::fbjni)
                add_library(fbjni::fbjni SHARED IMPORTED)
                set_target_properties(fbjni::fbjni PROPERTIES
                  IMPORTED_LOCATION "${CMAKE_CURRENT_LIST_DIR}/lib/${ANDROID_ABI}/libfbjni.so"
                  INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_LIST_DIR}/include"
                )
              endif()
              """.lstrip()
          )
          gradle = Path("apps/mobile/android/app/build.gradle")
          text = gradle.read_text()
          needle = "defaultConfig {"
          fbjni_dir = root.resolve()
          insert = f"""
                  externalNativeBuild {{
                      cmake {{
                          arguments "-Dfbjni_DIR={fbjni_dir}"
                      }}
                  }}
          """
          if "fbjni_DIR" not in text:
              index = text.find(needle)
              if index < 0:
                  raise SystemExit("android/app/build.gradle has no defaultConfig block")
              index += len(needle)
              text = text[:index] + "\n" + insert + text[index:]
              gradle.write_text(text)
          old = "find_package(fbjni REQUIRED CONFIG)"
          new = """set(_fbjni_root_mode ${CMAKE_FIND_ROOT_PATH_MODE_PACKAGE})
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)
          find_package(fbjni REQUIRED CONFIG)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ${_fbjni_root_mode})"""
          patched = 0
          for cmake in Path("node_modules").rglob("ReactNative-application.cmake"):
              contents = cmake.read_text()
              if old not in contents or "CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH" in contents:
                  continue
              cmake.write_text(contents.replace(old, new, 1))
              patched += 1
          if patched == 0:
              raise SystemExit("did not patch ReactNative-application.cmake")
          print(f"patched {patched} cmake file(s)")
          PY

      # Overwrite the template keystore so every CI APK carries the same
      # signature as existing sideloaded installs (in-place updates).
      - name: Install signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "ANDROID_DEBUG_KEYSTORE_B64 secret is not set." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > apps/mobile/android/app/debug.keystore

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        run: |
          mkdir -p apk-publish
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "apk-publish/t3code-${{ needs.preflight.outputs.tag }}-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apk-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build_desktop, build_android]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build_desktop.result == 'success' && needs.build_android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "desktop-*"
          merge-multiple: true
          path: release-assets

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
